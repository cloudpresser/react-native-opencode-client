appId: com.cloudpresser.opencodeclient
---
- launchApp
- runFlow:
    file: add-server.yaml
- tapOn:
    id: "edit-server-btn-Test Server"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: "add-edit-server-screen"
# Connection status badge should be visible when editing an existing server
- assertVisible:
    id: "connection-status-badge"
- tapOn:
    id: "server-name-input"
- waitForAnimationToEnd:
    timeout: 1000
- eraseText
- inputText: "Updated Server"
- hideKeyboard
- tapOn:
    id: "save-server-button"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Updated Server"
- assertNotVisible: "Test Server"
- assertVisible: "OpenCode Servers"