appId: com.cloudpresser.opencodeclient
env:
  SERVER_NAME: "Test Server"
  SESSION_TITLE: "Test Session"
---
- launchApp
- runFlow:
    file: create-session.yaml
- tapOn: ".*${SESSION_TITLE}.*"
- tapOn: ".*Git.*"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: ".*Modified Files.*"
- tapOn:
    id: "refresh-git-btn"
- assertVisible: ".*No modified files.*"