appId: com.cloudpresser.opencodeclient
env:
  SERVER_NAME: "Test Server"
  SESSION_TITLE: "Test Session"
---
- launchApp
- runFlow:
    file: create-session.yaml
- tapOn: ".*${SESSION_TITLE}.*"
- tapOn: ".*Terminal.*"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: ".*Terminal.*"
- tapOn:
    id: "terminal-input"
- waitForAnimationToEnd:
    timeout: 1000
- inputText: "ls -la"
- hideKeyboard
- tapOn:
    id: "terminal-send-btn"
- assertVisible: ".*ls -la.*"