appId: com.cloudpresser.opencodeclient
---
- launchApp
- assertVisible:
      text: "OpenCode Servers"
- waitForAnimationToEnd:
      timeout: 2000
- tapOn:
      id: add-server-button
- waitForAnimationToEnd:
      timeout: 2000
- assertVisible:
      id: "add-edit-server-screen"
- tapOn:
      id: "server-name-input"
- waitForAnimationToEnd:
      timeout: 1000
- inputText: "Test Server"
- hideKeyboard
- tapOn:
      id: "server-host-input"
- waitForAnimationToEnd:
      timeout: 1000
- inputText: "localhost"
- hideKeyboard
- tapOn:
      id: "server-port-input"
- waitForAnimationToEnd:
      timeout: 1000
- inputText: "4096"
- hideKeyboard
- tapOn:
      id: "server-apikey-input"
- waitForAnimationToEnd:
      timeout: 1000
- inputText: "test-api-key-123"
- hideKeyboard
- tapOn:
      id: "save-server-button"
- tapOn:
      id: "save-server-button"
- waitForAnimationToEnd:
      timeout: 2000
- assertVisible: ".*Test Server.*"
- assertVisible: ".*OpenCode Servers.*"
