name: EAS Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Extract version from tag
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Building version: $VERSION"
          else
            echo "version=dev" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android-keystore.jks
          echo "Keystore created successfully"

      - name: Configure EAS Credentials
        run: |
          cat > credentials.json << EOF
          {
            "android": {
              "keystore": {
                "keystorePath": "android-keystore.jks",
                "keystorePassword": "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}",
                "keyAlias": "${{ secrets.ANDROID_KEY_ALIAS }}",
                "keyPassword": "${{ secrets.ANDROID_KEY_PASSWORD }}"
              }
            }
          }
          EOF
          echo "Credentials configured"

      - name: Build Android APK
        id: eas_build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            MSG="Release v${{ steps.get_version.outputs.version }}"
          else
            MSG="Manual build from ${{ github.sha }}"
          fi
          echo "Building APK: $MSG"
          
          # Capture full EAS output for debugging
          set +e
          EAS_OUTPUT=$(eas build --platform android --profile preview --non-interactive --wait --json --message "$MSG" 2>&1)
          EAS_EXIT=$?
          set -e
          
          echo "--- EAS CLI output ---"
          echo "$EAS_OUTPUT"
          echo "--- End EAS CLI output (exit code: $EAS_EXIT) ---"
          
          # Try to extract build ID from JSON output
          BUILD_ID=$(echo "$EAS_OUTPUT" | jq -r '.[0].id // empty' 2>/dev/null || true)
          BUILD_STATUS=$(echo "$EAS_OUTPUT" | jq -r '.[0].status // empty' 2>/dev/null || true)
          
          echo "Build ID: $BUILD_ID"
          echo "Build Status: $BUILD_STATUS"
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "build_status=$BUILD_STATUS" >> $GITHUB_OUTPUT
          
          if [ $EAS_EXIT -ne 0 ] || [ -z "$BUILD_ID" ]; then
            echo "::error::EAS build command failed (exit $EAS_EXIT)"
            # Try to get build details if we have an ID
            if [ -n "$BUILD_ID" ]; then
              echo "--- Build details ---"
              eas build:view "$BUILD_ID" --json 2>&1 | jq '.' || true
              echo "--- Build logs URL ---"
              echo "https://expo.dev/accounts/cloudpresser/projects/react-native-opencode-client/builds/$BUILD_ID"
            fi
            exit 1
          fi
          
          if [ "$BUILD_STATUS" = "ERRORED" ] || [ "$BUILD_STATUS" = "CANCELED" ]; then
            echo "::error::EAS build finished with status: $BUILD_STATUS"
            echo "--- Build details ---"
            eas build:view "$BUILD_ID" --json 2>&1 | jq '.' || true
            echo "https://expo.dev/accounts/cloudpresser/projects/react-native-opencode-client/builds/$BUILD_ID"
            exit 1
          fi

      - name: Download APK
        if: startsWith(github.ref, 'refs/tags/v') && steps.eas_build.outputs.build_status == 'FINISHED'
        run: |
          BUILD_ID=${{ steps.eas_build.outputs.build_id }}
          echo "Downloading APK for build $BUILD_ID"
          
          # Poll for artifact URL (EAS may take a moment to publish artifacts after build completes)
          for i in $(seq 1 30); do
            APK_URL=$(eas build:view $BUILD_ID --json 2>/dev/null | jq -r '.artifacts.buildUrl // empty')
            if [ -n "$APK_URL" ] && [ "$APK_URL" != "null" ]; then
              echo "APK URL: $APK_URL"
              break
            fi
            echo "Attempt $i/30: Artifact not ready yet, waiting 10s..."
            sleep 10
          done
          
          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "::error::Failed to get APK URL after 5 minutes"
            eas build:view $BUILD_ID --json 2>&1 | jq '.' || true
            exit 1
          fi
          
          curl -L -o opencode-client-v${{ steps.get_version.outputs.version }}.apk "$APK_URL"
          ls -lh *.apk

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.eas_build.outputs.build_status == 'FINISHED'
        uses: softprops/action-gh-release@v1
        with:
          files: opencode-client-v${{ steps.get_version.outputs.version }}.apk
          tag_name: v${{ steps.get_version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
