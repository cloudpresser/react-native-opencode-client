name: EAS Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Extract version from tag
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Building version: $VERSION"
          else
            echo "version=dev" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: npm ci

      - name: Setup Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android-keystore.jks
          echo "Keystore created successfully"

      - name: Configure EAS Credentials
        run: |
          cat > credentials.json << EOF
          {
            "android": {
              "keystore": {
                "keystorePath": "android-keystore.jks",
                "keystorePassword": "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}",
                "keyAlias": "${{ secrets.ANDROID_KEY_ALIAS }}",
                "keyPassword": "${{ secrets.ANDROID_KEY_PASSWORD }}"
              }
            }
          }
          EOF
          echo "Credentials configured"

      - name: Build Android APK (Preview)
        if: startsWith(github.ref, 'refs/tags/v')
        id: build_tag
        run: |
          echo "Building preview APK for version ${{ steps.get_version.outputs.version }}"
          BUILD_ID=$(eas build --platform android --profile preview --non-interactive --wait --json --message "Release v${{ steps.get_version.outputs.version }}" | jq -r '.[0].id')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Build ID: $BUILD_ID"
      
      - name: Build Android APK (Manual)
        if: github.event_name == 'workflow_dispatch'
        id: build_manual
        run: |
          echo "Building manual APK"
          BUILD_ID=$(eas build --platform android --profile preview --non-interactive --wait --json --message "Manual build from ${{ github.sha }}" | jq -r '.[0].id')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Build ID: $BUILD_ID"

      - name: Download APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          BUILD_ID=${{ steps.build_tag.outputs.build_id }}
          echo "Downloading APK for build $BUILD_ID"
          APK_URL=$(eas build:view $BUILD_ID --json | jq -r '.artifacts.buildUrl')
          echo "APK URL: $APK_URL"
          curl -L -o opencode-client-v${{ steps.get_version.outputs.version }}.apk "$APK_URL"
          ls -lh *.apk

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: opencode-client-v${{ steps.get_version.outputs.version }}.apk
          tag_name: v${{ steps.get_version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
