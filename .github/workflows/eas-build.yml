name: EAS Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Extract version from tag
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Building version: $VERSION"
          else
            echo "version=dev" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK (Preview)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "Building preview APK for version ${{ steps.get_version.outputs.version }}"
          eas build --platform android --profile preview --non-interactive --no-wait --message "Release v${{ steps.get_version.outputs.version }}"
      
      - name: Build Android APK (Manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Building manual APK"
          eas build --platform android --profile preview --non-interactive --no-wait --message "Manual build from ${{ github.sha }}"
