name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK (Local)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Extract version from tag
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=dev
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Set fun theme for CI
        run: |
          THEMES=(catppuccin-mocha dracula gruvbox-dark-hard nord tokyo-night-dark)
          THEME=${THEMES[$RANDOM % ${#THEMES[@]}]}
          echo "THEME=$THEME" >> $GITHUB_ENV
          echo "Using theme: $THEME"

      - name: Build theme
        run: node scripts/build-theme.js

      - name: Generate signing keystore
        run: |
          KEYSTORE_DIR="$HOME/.android"
          mkdir -p "$KEYSTORE_DIR"

          # Use secrets if available, otherwise generate a throwaway debug keystore
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using keystore from secrets"
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_DIR/release.keystore"
            KEYSTORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
            KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"
          else
            echo "Generating ephemeral signing keystore"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_DIR/release.keystore" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias release \
              -dname "CN=CI Build,O=OpenCode Client,L=Unknown,S=Unknown,C=US" \
              -storepass android -keypass android
            KEYSTORE_PASSWORD="android"
            KEY_ALIAS="release"
            KEY_PASSWORD="android"
          fi

          # Write credentials.json for eas build --local
          cat > credentials.json <<EOF
          {
            "android": {
              "keystore": {
                "keystorePath": "$KEYSTORE_DIR/release.keystore",
                "keystorePassword": "$KEYSTORE_PASSWORD",
                "keyAlias": "$KEY_ALIAS",
                "keyPassword": "$KEY_PASSWORD"
              }
            }
          }
          EOF

      - name: Build APK locally
        run: |
          eas build --local \
            --platform android \
            --profile preview-local \
            --non-interactive \
            --output ./app-release.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-client-v${{ steps.get_version.outputs.version }}.apk
          path: ./app-release.apk

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: opencode-client-v${{ steps.get_version.outputs.version }}.apk
          tag_name: v${{ steps.get_version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
