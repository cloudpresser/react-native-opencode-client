name: EAS Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build via EAS Workflow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Extract version from tag
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=dev
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run EAS Workflow (build)
        id: eas_workflow
        run: |
          echo "Triggering EAS Workflow: build.yaml"

          set +e
          RESULT=$(eas workflow:run .eas/workflows/build.yaml \
            --wait --json --non-interactive 2>&1)
          EXIT_CODE=$?
          set -e

          echo "--- EAS Workflow raw output ---"
          echo "$RESULT"
          echo "--- Exit code: $EXIT_CODE ---"

          # Try multiple jq paths to extract the build ID from workflow output
          BUILD_ID=""
          for path in \
            '.[0].outputs.build_id' \
            '.jobs.build_android.outputs.build_id' \
            '.. | .build_id? // empty' \
            '.[0].id'; do
            CANDIDATE=$(echo "$RESULT" | jq -r "$path" 2>/dev/null | head -1)
            if [ -n "$CANDIDATE" ] && [ "$CANDIDATE" != "null" ] && [ "$CANDIDATE" != "" ]; then
              BUILD_ID="$CANDIDATE"
              echo "Found build_id via jq path: $path"
              break
            fi
          done

          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Extracted build_id: $BUILD_ID"

          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::EAS Workflow failed (exit code $EXIT_CODE)"
            exit 1
          fi

          if [ -z "$BUILD_ID" ]; then
            echo "::warning::Could not extract build_id from workflow output — APK download will be skipped"
          fi

      - name: Download APK
        if: startsWith(github.ref, 'refs/tags/v') && steps.eas_workflow.outputs.build_id != ''
        run: |
          BUILD_ID=${{ steps.eas_workflow.outputs.build_id }}
          echo "Downloading APK for build $BUILD_ID"

          # Poll for artifact URL (EAS may take a moment to publish artifacts)
          APK_URL=""
          for i in $(seq 1 30); do
            APK_URL=$(eas build:view "$BUILD_ID" --json 2>/dev/null | jq -r '.artifacts.buildUrl // empty')
            if [ -n "$APK_URL" ] && [ "$APK_URL" != "null" ]; then
              echo "APK URL found: $APK_URL"
              break
            fi
            echo "Attempt $i/30: Artifact not ready yet, waiting 10s..."
            sleep 10
          done

          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "::error::Failed to get APK URL after 5 minutes"
            eas build:view "$BUILD_ID" --json 2>&1 | jq '.' || true
            exit 1
          fi

          curl -L -o "opencode-client-v${{ steps.get_version.outputs.version }}.apk" "$APK_URL"
          ls -lh *.apk

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.eas_workflow.outputs.build_id != ''
        uses: softprops/action-gh-release@v1
        with:
          files: opencode-client-v${{ steps.get_version.outputs.version }}.apk
          tag_name: v${{ steps.get_version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
