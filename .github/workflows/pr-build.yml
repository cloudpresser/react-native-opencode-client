name: PR Build APK

on:
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run TypeScript check
        run: yarn tsc

  build-apk:
    name: Build APK
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Pick random theme
        id: theme
        run: |
          THEMES=($(ls src/themes/*.json | xargs -I{} basename {} .json))
          SELECTED=${THEMES[$RANDOM % ${#THEMES[@]}]}
          echo "name=$SELECTED" >> $GITHUB_OUTPUT
          echo "Selected theme: $SELECTED"

      - name: Generate native fingerprint
        id: fingerprint
        run: |
          FINGERPRINT=$(node scripts/native-fingerprint.js --platform android)
          echo "hash=$FINGERPRINT" >> $GITHUB_OUTPUT
          echo "Native fingerprint: $FINGERPRINT"

      - name: Run Expo prebuild
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_GIT_STATUS: "1"

      - name: Generate ephemeral signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android-keystore.jks \
            -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=PR Build, O=CI, C=US"

      - name: Create signing config for Gradle
        run: |
          KEYSTORE_ABS="$GITHUB_WORKSPACE/android-keystore.jks"
          cat > android/app/eas-build.gradle << EOF
          android {
            signingConfigs {
              release {
                storeFile file("$KEYSTORE_ABS")
                storePassword "android"
                keyAlias "release"
                keyPassword "android"
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          EOF

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-deps-${{ hashFiles('android/build.gradle', 'android/app/build.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-deps-

      - name: Cache native build outputs
        uses: actions/cache@v4
        with:
          path: |
            android/.gradle
            android/app/build
            android/build
          key: ${{ runner.os }}-native-build-${{ steps.fingerprint.outputs.hash }}

      - name: Build APK with Gradle
        run: ./gradlew :app:assembleRelease
        working-directory: android
        env:
          THEME: ${{ steps.theme.outputs.name }}

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
            ./app-pr-${{ github.event.pull_request.number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        id: upload-apk
        with:
          name: pr-apk-${{ github.event.pull_request.number }}
          path: ./app-pr-${{ github.event.pull_request.number }}.apk
          retention-days: 14

      - name: Comment on PR with APK link
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: apk-build
          message: |
            **APK Build Successful**

            Download the APK from [this workflow run's artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            - **Artifact:** `pr-apk-${{ github.event.pull_request.number }}`
            - **Commit:** `${{ github.event.pull_request.head.sha }}`
            - **Theme:** `${{ steps.theme.outputs.name }}`
            - **Native fingerprint:** `${{ steps.fingerprint.outputs.hash }}`
            - **Expires:** 14 days
