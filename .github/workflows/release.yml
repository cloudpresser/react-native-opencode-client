name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          git fetch --tags
          BEFORE_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          npx semantic-release
          git fetch --tags
          AFTER_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          if [ "$BEFORE_TAG" != "$AFTER_TAG" ]; then
            echo "new_tag=$AFTER_TAG" >> $GITHUB_OUTPUT
            echo "New release created: $AFTER_TAG"
          else
            echo "No new release created"
          fi

      - name: Trigger EAS Build
        if: steps.semantic.outputs.new_tag != ''
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          gh workflow run eas-build.yml --ref ${{ steps.semantic.outputs.new_tag }}
          echo "Triggered EAS Build for ${{ steps.semantic.outputs.new_tag }}"
