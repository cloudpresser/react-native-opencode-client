name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.semantic.outputs.new_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          git fetch --tags
          BEFORE_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          npx semantic-release
          git fetch --tags
          AFTER_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          if [ "$BEFORE_TAG" != "$AFTER_TAG" ]; then
            echo "new_tag=$AFTER_TAG" >> $GITHUB_OUTPUT
            echo "New release created: $AFTER_TAG"
          else
            echo "No new release created"
          fi

  build-and-release:
    name: Build & Release APK
    needs: release
    if: needs.release.outputs.new_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.new_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION="${{ needs.release.outputs.new_tag }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate native fingerprint
        id: fingerprint
        run: |
          FINGERPRINT=$(node scripts/native-fingerprint.js --platform android)
          echo "hash=$FINGERPRINT" >> $GITHUB_OUTPUT
          echo "Native fingerprint: $FINGERPRINT"

      - name: Run Expo prebuild
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_GIT_STATUS: "1"

      - name: Generate signing keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android-keystore.jks
            KEYSTORE_ABS="$GITHUB_WORKSPACE/android-keystore.jks"
            cat > android/app/eas-build.gradle << EOF
          android {
            signingConfigs {
              release {
                storeFile file("$KEYSTORE_ABS")
                storePassword "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
                keyAlias "${{ secrets.ANDROID_KEY_ALIAS }}"
                keyPassword "${{ secrets.ANDROID_KEY_PASSWORD }}"
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          EOF
          else
            echo "No keystore secrets found, generating ephemeral keystore..."
            keytool -genkeypair -v \
              -keystore android-keystore.jks \
              -alias release \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=CI Build, O=CI, C=US"
            KEYSTORE_ABS="$GITHUB_WORKSPACE/android-keystore.jks"
            cat > android/app/eas-build.gradle << EOF
          android {
            signingConfigs {
              release {
                storeFile file("$KEYSTORE_ABS")
                storePassword "android"
                keyAlias "release"
                keyPassword "android"
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          EOF
          fi

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-deps-${{ hashFiles('android/build.gradle', 'android/app/build.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-deps-

      - name: Cache native build outputs
        uses: actions/cache@v4
        with:
          path: |
            android/.gradle
            android/app/build
            android/build
          key: ${{ runner.os }}-native-build-${{ steps.fingerprint.outputs.hash }}

      - name: Build APK with Gradle
        run: ./gradlew :app:assembleRelease
        working-directory: android
        env:
          THEME: tokyo-night-dark

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
            ./app-release.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./app-release.apk
          tag_name: ${{ needs.release.outputs.new_tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ steps.get_version.outputs.version }}
          path: ./app-release.apk

      - name: Discord notification (success)
        if: success() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\": \"Release v${{ steps.get_version.outputs.version }} published\\nNative fingerprint: ${{ steps.fingerprint.outputs.hash }}\\nAPK uploaded to: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.release.outputs.new_tag }}\\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK"

      - name: Discord notification (failure)
        if: failure() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\": \"Release build failed for ${{ needs.release.outputs.new_tag }}\\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK"
